[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SqueezeAttention-ascend"
version = "0.1.0"
description = "Monkeypatch adapter: SqueezeAttention per-layer KV windows for vllm-ascend v0.23.0 (no vllm-ascend source changes)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["squeeze_ascend"]

[tool.hatch.build.targets.wheel.force-include]
"squeeze_ascend.pth" = "squeeze_ascend.pth"
