[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvpress-ascend"
version = "0.1.0"
description = "Monkeypatch adapter: kvpress KV-cache compression for vllm-ascend v0.23.0 (no vllm-ascend source changes)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["kvpress_ascend"]

# Force-include the .pth file into the wheel ROOT so pip drops it straight
# into site-packages -> interpreter startup auto-imports the package.
[tool.hatch.build.targets.wheel.force-include]
"kvpress_ascend.pth" = "kvpress_ascend.pth"
